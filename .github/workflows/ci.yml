name: CI

on:
  push:
    branches: [main]
    # The website alone doesn't need the macOS build.
    paths-ignore: ['docs/**']
  # Every pull request runs it, even docs-only ones: main requires this check to pass.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Apple silicon runner: the app links AppKit and builds whisper.cpp with Metal.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features explainit-app/dev-hooks -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Bundle
        run: make bundle
