[workspace]
resolver = "3"
members = ["crates/explainit-core", "crates/explainit-cli", "crates/explainit-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mihaicristianfarcas/explainit"

[workspace.dependencies]
explainit-core = { path = "crates/explainit-core" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
