[package]
name = "explainit-app"
description = "ExplainIt: a macOS menu-bar app that turns spoken bug reports into Markdown notes, transcribed locally"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "explainit-app"
path = "src/main.rs"

[features]
# Enables `explainit simulate` (feed a WAV as if recorded). Used by the end-to-end test only.
dev-hooks = []

[dependencies]
explainit-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
url.workspace = true
block2 = "0.6"
cpal = "0.18"
global-hotkey = "0.8"
hound = "3.5"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-foundation = "0.3"
sha2 = "0.11"
tao = "0.37"
tray-icon = "0.26"
ureq = "3"
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tempfile.workspace = true
